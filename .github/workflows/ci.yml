# Tests and the claims check. No network and no FastF1 cache are needed:
# tests that depend on cached laps or a compiled Stan model skip themselves.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python scripts/paper/check_claims.py
      - run: python scripts/paper/build_manuscript_assets.py --check
